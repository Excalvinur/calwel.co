<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Calvin Welch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Nanum+Myeongjo&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body class="contact-page">
    <video id="floatingLogo" class="floating-logo" muted autoplay loop>
        <source src="imgs/cwLogoMarkAniV3.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <nav class="banner">
        <div class="banner-name">Calvin Welch</div>

        <!-- Hamburger Menu Icon -->
        <button class="hamburger-menu" id="hamburgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Work</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="desktop-only">
        <header><h1>Get in<span class="gradient-text">touch</span>.</h1></header>
    </div>
    <div class="mobile-only">
        <header><h1>Get in<br><span class="gradient-text">touch</span>.</h1></header>
    </div>


    <main>
        <section class="contact-form-container">
            <form action="https://formspree.io/f/xojgjwqq" method="POST" class="contact-form" id="contactForm">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name" required>
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="form-group">
                    <textarea name="looking-for" placeholder="What are you looking for?" required></textarea>
                </div>

                <div class="form-group">
                    <input type="text" name="budget" placeholder="What's your budget?" required>
                </div>

                <div class="form-group">
                    <input type="text" name="deadline" placeholder="When does this need to be finished?" required>
                </div>

                <button type="submit" class="submit-btn">SEND</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Calvin Welch. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
